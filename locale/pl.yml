# Wspólna sekcja awatarów, używana przez flarum-thumb-sliders i flarum-topic-rating.
# Trzymaj ten blok IDENTYCZNY w obu rozszerzeniach, aby stringi były dostępne
# niezależnie od tego, które jest zainstalowane (zduplikowane klucze łączą się bez szkody).
tryhackx-avatars:
  admin:
    title: "Awatary na liście tematów"
    help: "Wybierz jak zachowuje się awatar autora na liście tematów, osobno dla desktopu i wersji mobilnej. To ustawienie współdzielone — zmiana tutaj zmienia je także w Thumb Sliders / Topic Rating, zależnie od tego co masz zainstalowane."
    thumbs_inactive: "Thumb Sliders nie jest aktywne, więc nie ma miniatury, którą można zastąpić awatar. Opcje \"zastąp\" poniżej działają jak \"Pokaż awatar\" — użyj \"Ukryj awatar\", aby usunąć awatary (np. dla lżejszej listy na telefonie)."
    save_error: "Nie udało się zapisać ustawienia awatara. Spróbuj ponownie."
    device_desktop: "Desktop"
    device_mobile: "Mobilny"
    mode_show: "Pokaż awatar"
    mode_with_image: "Zastąp miniaturą, gdy temat ma obraz"
    mode_always: "Zawsze zastępuj miniaturą"
    mode_hide: "Ukryj awatar"
    hint_show: "Awatar autora jest zawsze pokazywany."
    hint_hide: "Awatar nigdy nie jest pokazywany. Jeśli dostępna jest miniatura, zajmuje jego miejsce; w przeciwnym razie wiersz po prostu nie ma awatara."
    hint_with_image: "Miniatura zastępuje awatar tylko gdy temat ma prawdziwy obraz; w przeciwnym razie pokazywany jest awatar."
    hint_always: "Miniatura (lub skonfigurowany zamiennik) zawsze zastępuje awatar; tematy bez żadnej miniatury zachowują awatar."
    hint_replace_no_thumbs: "Thumb Sliders jest nieaktywne, więc awatar jest pokazywany jak zwykle. Zainstaluj/włącz Thumb Sliders, aby zastąpić go miniaturą, albo wybierz \"Ukryj awatar\"."
